<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9885a"/>
      <stop offset="50%" stop-color="#a06a40"/>
      <stop offset="100%" stop-color="#6f4a2b"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#d9a05b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a06a40" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#e8bd7d" stroke-width="4"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#f6eedd" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Inner Soft Glow -->
  <circle cx="200" cy="200" r="150" fill="url(#ringGlow)" />

  <!-- Professional Monogram / Badge -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="200" y="180" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="110" font-weight="800" fill="#ffffff" letter-spacing="-3">SS</text>
    <text x="200" y="255" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="700" fill="#f4e5c8" letter-spacing="4">TALENT ACQUISITION</text>
  </g>
</svg>
